services:
  - type: web
    name: quantbattle-worker
    runtime: docker
    rootDirectory: worker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon        # cámbialo a sao-paulo si Render lo soporta para menos latencia
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: https://www.quantbattle.co,https://quantbattle.co,https://www.quantbattle.co,http://localhost:3000
      - key: SUPABASE_URL
        sync: false        # pon tu valor real en el dashboard de Render
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
