name: operations-monitor
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operations-monitor
  cancel-in-progress: false
jobs:
  check:
    if: vars.ML_DAILY_TOURNAMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: python -m pip install -r worker/requirements.txt
      - name: Check durable referee heartbeat and overdue rounds
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python check_operations.py
