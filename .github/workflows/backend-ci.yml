name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install worker deps
        run: python -m pip install -r worker/requirements.txt -r worker/requirements-research.txt
      - name: Run worker tests
        working-directory: worker
        run: TESTING=1 python -m pytest tests/ -q -m "not external" --junitxml=test-results/worker.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-evidence-${{ github.sha }}
          path: worker/test-results
