name: backend-ci

on:
  push:
    paths:
      - "worker/**"
  pull_request:
    paths:
      - "worker/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install worker deps
        run: python -m pip install -r worker/requirements.txt -r worker/requirements-research.txt
      - name: Run worker tests
        working-directory: worker
        run: TESTING=1 python -m pytest tests/ -q -x -m "not external"
