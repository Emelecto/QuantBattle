name: QuantLab Weekly Tournament Scheduler

on:
  schedule:
    # Revisión diaria; create_ml_round solo publica una ronda cada 7 días.
    - cron: "0 6 * * *"
  # Permitir ejecucion manual desde la pestaña Actions
  workflow_dispatch:

jobs:
  generate-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        round_type: [practice, historical, prospective]
    # La generacion del dataset sintetico (600x350) es pesada en RAM.
    # GitHub Actions corre en VM de 7 GB y no se duerme, asi que la generamos
    # AQUI y la subimos a Supabase Storage. El worker de Render solo SIRVE
    # los datasets (ya no los genera) -> se acaban los reinicios por memoria.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate or mature ${{ matrix.round_type }} ML rounds
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATASET_SALT: ${{ secrets.DATASET_SALT }}
          ROUND_DAYS: "7"
          ML_ROUND_MODE: ${{ matrix.round_type == 'practice' && 'sintetico' || 'real' }}
          ML_ROUND_TYPE: ${{ matrix.round_type }}
          ML_REAL_UNIVERSE: ${{ secrets.ML_REAL_UNIVERSE }}
          N_ACTIVOS: "600"
          N_ERAS: "350"
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ERROR: SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY deben estar en Secrets"
            exit 1
          fi
          echo "Procesando ronda ML: $ML_ROUND_TYPE"
          python generate_dataset_github.py

  evaluate-rounds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: generate-dataset
    if: always()
    # Evaluar rondas vencidas es ligero; lo dejamos en el worker de Render
    # via su endpoint asincrono (devuelve 200 al instante).
    steps:
      - name: Trigger evaluation on worker
        env:
          SCHEDULER_KEY: ${{ secrets.SCHEDULER_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ] || [ -z "$SCHEDULER_KEY" ]; then
            echo "ERROR: WORKER_URL y SCHEDULER_KEY deben estar configurados en Secrets"
            exit 1
          fi
          echo "Llamando a $WORKER_URL/scheduler/evaluate ..."
          HTTP_CODE="000"
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /tmp/eval_response.txt -w "%{http_code}" \
              -X POST "$WORKER_URL/scheduler/evaluate?sync=true" \
              -H "Content-Type: application/json" \
              -H "X-Scheduler-Key: $SCHEDULER_KEY" \
              --max-time 600)
            echo "Intento $i -> HTTP Status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            echo "Reintentando en 15s..."
            sleep 15
          done
          echo "HTTP Status final: $HTTP_CODE"
          cat /tmp/eval_response.txt
          echo ""
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: la evaluacion respondio con codigo $HTTP_CODE tras reintentos"
            exit 1
          fi
          echo "Evaluacion ejecutada exitosamente."
