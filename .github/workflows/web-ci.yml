name: web-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      NEXT_PUBLIC_WORKER_URL: https://quantlab2.onrender.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0 --format json --output-file playwright-report/lint.json
      - run: npm audit --omit=dev --audit-level=low
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-evidence-${{ github.sha }}
          path: |
            web/test-results
            web/playwright-report
